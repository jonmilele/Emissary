version: '3.8'
services:
  web:
    build: .
    ports:
      - "80:80"
    depends_on:
      - db
    volumes:
      - ./html:/var/www/html
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ./php-timezone.ini:/usr/local/etc/php/conf.d/timezone.ini:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.emissary.rule=Host(`emissary.example.com`)
      - traefik.http.routers.emissary.entrypoints=websecure
      - traefik.http.routers.emissary.tls=true
      - traefik.http.routers.emissary.tls.certresolver=default
      - traefik.http.routers.emissary.middlewares=security-headers@file
      - traefik.http.services.emissary.loadbalancer.server.port=80
  db:
    image: mysql:8.1.0
    env_file:
      - .env
    volumes:
      - ./mysql_data:/var/lib/mysql
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8080:80"
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_ABSOLUTE_URI: https://emissary.example.com/phpmyadmin/
    labels:
      - traefik.enable=true
      - traefik.http.routers.emissary-phpmyadmin.rule=Host(`emissary.example.com`) && PathPrefix(`/phpmyadmin`)
      - traefik.http.routers.emissary-phpmyadmin.entrypoints=websecure
      - traefik.http.routers.emissary-phpmyadmin.tls=true
      - traefik.http.routers.emissary-phpmyadmin.tls.certresolver=default
      - traefik.http.routers.emissary-phpmyadmin.middlewares=emissary-phpmyadmin-slash,emissary-phpmyadmin-strip,security-headers@file
      - traefik.http.middlewares.emissary-phpmyadmin-slash.redirectregex.regex=^(https?://[^/]*)/phpmyadmin$$
      - traefik.http.middlewares.emissary-phpmyadmin-slash.redirectregex.replacement=$${1}/phpmyadmin/
      - traefik.http.middlewares.emissary-phpmyadmin-slash.redirectregex.permanent=true
      - traefik.http.middlewares.emissary-phpmyadmin-strip.stripprefix.prefixes=/phpmyadmin
      - traefik.http.services.emissary-phpmyadmin.loadbalancer.server.port=8080

